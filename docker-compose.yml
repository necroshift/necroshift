services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: necroshift
      POSTGRES_PASSWORD: necroshift
      POSTGRES_DB: necroshift
    ports:
      - "5433:5432"
    volumes:
      - necroshift_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U necroshift -d necroshift"]
      interval: 2s
      timeout: 2s
      retries: 20

  # Owns the Docker socket so the `web` app never has to — see the
  # self-heal design spec. Only launches ephemeral `necroshift-sandbox`
  # containers; build that image once with:
  #   docker build -f apps/sandbox-runner/Dockerfile.sandbox -t necroshift-sandbox .
  sandbox-runner:
    build:
      context: .
      dockerfile: apps/sandbox-runner/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://necroshift:necroshift@postgres:5432/necroshift
      SANDBOX_IMAGE: necroshift-sandbox
      SANDBOX_DOCKER_NETWORK: necroshift_default
      PORT: "4000"
      # Read from the root .env (docker compose auto-loads it for variable
      # substitution) — must match what `web` sends, see .env.example.
      SANDBOX_RUNNER_SECRET: ${SANDBOX_RUNNER_SECRET:?SANDBOX_RUNNER_SECRET must be set in .env}
    ports:
      - "4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  necroshift_postgres_data:
